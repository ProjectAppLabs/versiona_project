name: CI — Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────
  # Backend — pytest (Django + MySQL), duration-balanced
  #
  # Three recent samples put this block at 9:43-10:58 versus a 5:12 median
  # E2E block. Setup costs about 1:53 and the test step 8:46, so
  # t(N) = setup + work/N first crosses below E2E at N=3.
  # Files are assigned by JUnit duration, never by test count.
  # ───────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: versiona-ci
          MYSQL_DATABASE: versiona
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pversiona-ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_DB_ENGINE: django.db.backends.mysql
      DJANGO_DB_NAME: versiona
      DB_USER: root
      DB_PASSWORD: versiona-ci
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      # root, deliberately: the mysql image grants MYSQL_USER rights on
      # MYSQL_DATABASE only, so pytest-django could not create test_versiona.
      # Service containers cannot mount an init script, and the container is
      # thrown away with the job.
      REDIS_URL: redis://127.0.0.1:6379/1
      CELERY_TASK_ALWAYS_EAGER: '1'
      DJANGO_SECRET_KEY: ci-only-secret
      # Bulk fixtures share users; quota enforcement is tested separately at
      # its configured limit. This finite override belongs only to CI.
      THROTTLE_UPLOAD: '1000/hour'
      # No AWS_*: with no bucket configured, settings.py resolves object storage
      # to the filesystem backend — the one every deployment runs. The suite
      # would ignore a bucket anyway: conftest.py's autouse _object_storage_root
      # forces AWS_STORAGE_BUCKET_NAME='' so tests stay hermetic.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR system deps (tesseract + spa + ghostscript for ocrmypdf)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa ghostscript

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (for ast-parser tests)
        working-directory: frontend
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Verify shards cover the complete suite
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/backend-shard-files.py" --check 3

      - name: Run pytest with coverage (shard ${{ matrix.shard }})
        # pytest.ini remains the source of the 14 --cov targets. The global
        # floor and module gates move to the combined report below.
        run: |
          FILES=$(python3 "$GITHUB_WORKSPACE/scripts/ci/backend-shard-files.py" --shard ${{ matrix.shard }})
          pytest -n auto --dist=loadfile -v --tb=short --junitxml=pytest-results.xml --cov-branch --cov-fail-under=0 --cov-report= $FILES

      - name: Upload backend shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-shard-${{ strategy.job-index }}
          path: |
            backend/.coverage*
            backend/pytest-results.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Combine first, then enforce coverage. Per-shard floors would measure only a
  # fraction of the source tree and produce a false failure.
  backend-coverage-merge:
    if: always()
    needs: [backend-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install coverage
        run: python -m pip install coverage

      - name: Download backend shard results
        uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-*
          path: backend/shard-artifacts
          merge-multiple: false

      - name: Combine coverage and merge junit
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/backend-merge-shards.py" --expected-shards 3

      - name: Enforce global backend coverage floor
        run: python -m coverage report --rcfile=.coveragerc --fail-under=80

      - name: Engine module coverage gate (95% on the D5 ground)
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/coverage-module-gate.py" coverage-backend.json >> "$GITHUB_STEP_SUMMARY"

      - name: Backend coverage summary
        if: always()
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/backend-job-summary.py" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: |
            backend/coverage-backend.json
            backend/coverage-backend.xml
            backend/pytest-results.xml
          if-no-files-found: error
          retention-days: 5

  # ───────────────────────────────────────────
  # Frontend — Jest unit & component tests
  # ───────────────────────────────────────────
  frontend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run Jest tests with coverage
        run: |
          NODE_OPTIONS='--no-deprecation' npx jest --config jest.config.cjs --coverage --ci --forceExit --json --outputFile=jest-results.json || true
          node scripts/coverage-summary.cjs
          # Fail the step if tests failed
          node -e "const r=require('./jest-results.json'); if(!r.success) process.exit(1);"

      - name: Copy test results alongside coverage
        if: always()
        run: cp jest-results.json coverage/ 2>/dev/null || true

      - name: Frontend unit coverage summary
        if: always()
        run: node "$GITHUB_WORKSPACE/scripts/ci/frontend-job-summary.cjs" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload frontend-unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-unit
          path: |
            frontend/coverage/coverage-summary.json
            frontend/coverage/jest-results.json
          retention-days: 5

  # ───────────────────────────────────────────
  # Frontend — Playwright E2E tests
  # ───────────────────────────────────────────
  frontend-e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: versiona-ci
          MYSQL_DATABASE: versiona
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pversiona-ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q --spider http://localhost:8025/livez"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_DB_ENGINE: django.db.backends.mysql
      DJANGO_DB_NAME: versiona
      DB_USER: root
      DB_PASSWORD: versiona-ci
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      # root, deliberately: the mysql image grants MYSQL_USER rights on
      # MYSQL_DATABASE only, so pytest-django could not create test_versiona.
      # Service containers cannot mount an init script, and the container is
      # thrown away with the job.
      REDIS_URL: redis://127.0.0.1:6379/1
      CELERY_TASK_ALWAYS_EAGER: '1'
      DJANGO_SECRET_KEY: ci-only-secret
      THROTTLE_UPLOAD: '1000/hour'
      # No AWS_* and no OBJECT_STORAGE_SENDFILE_ROOT: the E2E run exercises the
      # filesystem backend serving signed URLs straight from Django, which is
      # exactly how staging and production are configured. Previously this job
      # set a bucket and ran S3/MinIO — a configuration no deployment uses, so
      # the path that actually ships was never exercised end to end.
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      DJANGO_EMAIL_HOST: 127.0.0.1
      DJANGO_EMAIL_PORT: '1025'
      DJANGO_EMAIL_USE_TLS: 'false'
      DJANGO_DEFAULT_FROM_EMAIL: versiona@localhost
      MAILPIT_API: http://127.0.0.1:8025
      # Shared browser-runner IP; quota-specific backend tests enforce 5/min.
      THROTTLE_AUTH: '1000/min'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Create backend venv and install deps
        working-directory: backend
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt

      - name: Run backend migrations
        working-directory: backend
        run: venv/bin/python manage.py migrate --no-input

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers with system deps
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter='json,./e2e/reporters/flow-coverage-reporter.mjs'
        env:
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results/playwright-results.json

      - name: Upload E2E flow coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-e2e
          path: |
            frontend/e2e-results/flow-coverage.json
            frontend/e2e-results/playwright-results.json
          retention-days: 5

      - name: Upload test traces (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # ───────────────────────────────────────────
  # Coverage Summary — aggregates all reports
  # ───────────────────────────────────────────
  coverage-summary:
    if: always()
    needs: [backend-coverage-merge, frontend-unit-tests, frontend-e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: coverage-artifacts/backend
        continue-on-error: true

      - name: Download frontend-unit coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend-unit
          path: coverage-artifacts/frontend-unit
        continue-on-error: true

      - name: Download frontend-e2e coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend-e2e
          path: coverage-artifacts/frontend-e2e
        continue-on-error: true

      - name: Generate coverage summary
        if: always()
        id: summary
        run: node scripts/coverage-summary-ci.cjs

      - name: Write Job Summary
        run: cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report (md)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-md
          path: coverage-report.md
          retention-days: 5

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coverage-report.md
